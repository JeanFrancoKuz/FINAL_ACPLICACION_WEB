{% for pago in pagos %}
<tr>
    <td>{{ loop.index }}</td>
    <td>${{ pago.monto }}</td>
    <td>{{ pago.tipo.value }}</td>
    <td>{{ pago.fecha_pago.strftime('%d-%m-%Y %H:%M') }}</td>
    <td>
        <span class="badge 
            {% if pago.estado.value == 'PENDIENTE' %}bg-warning
            {% elif pago.estado.value == 'VALIDADO' %}bg-success
            {% elif pago.estado.value == 'RECHAZADO' %}bg-danger
            {% endif %}">
            {{ pago.estado.value }}
        </span>
    </td>
    <td>
        {% if pago.fotos %}
            {% for foto in pago.fotos %}
                <a href="{{ url_for('static', filename=foto.ruta) }}" target="_blank">Ver</a><br>
            {% endfor %}
        {% else %}
            -
        {% endif %}
    </td>
</tr>
{% else %}
<tr>
    <td colspan="6" class="text-center">No hay pagos registrados.</td>
</tr>
{% endfor %}
