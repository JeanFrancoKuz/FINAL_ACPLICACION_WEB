{% extends "base/layout_admin.html" %}

{% block title %}Agregar Cliente - Admin{% endblock %}

{% block content %}
<h1 class="mb-4">Agregar Cliente</h1>

<form method="POST" action="{{ url_for('admin.cliente_crear') }}">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" name="correo" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Cédula</label>
        <input type="text" name="cedula" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Rol</label>
        <select name="rol_id" class="form-select" required>
            {% for rol in roles %}
            <option value="{{ rol.id }}">{{ rol.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="text-end">
        <a href="{{ url_for('admin.clientes') }}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
</form>
{% endblock %}
