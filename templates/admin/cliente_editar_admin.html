{% extends "base/layout_admin.html" %}

{% block title %}Editar Cliente{% endblock %}

{% block content %}
<h2 class="fw-bold mb-4">Editar Cliente</h2>

<div class="card shadow-sm mb-4">
    <div class="card-body">

        <!-- Formulario de edición -->
        <form action="{{ url_for('admin.editar_cliente', id=cliente.id) }}" method="POST" enctype="multipart/form-data">

            <!-- Nombre -->
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control" value="{{ cliente.nombre }}" required>
            </div>

            <!-- Correo -->
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" name="correo" class="form-control" value="{{ cliente.correo }}" required>
            </div>

            <!-- Cédula -->
            <div class="mb-3">
                <label class="form-label">Cédula</label>
                <input type="text" name="cedula" class="form-control" value="{{ cliente.cedula }}" required>
            </div>

            <!-- Teléfono -->
            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono }}" required>
            </div>

            <!-- Estado membresía -->
            <div class="mb-3">
                <label class="form-label">Estado de Membresía</label>
                <select name="estado_membresia" class="form-select" required>
                    {% for estado in ['ACTIVO','INACTIVO','PENDIENTE','SUSPENDIDO','VENCIDO'] %}
                        <option value="{{ estado }}" {% if cliente.estado_membresia.value == estado %}selected{% endif %}>
                            {{ estado }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Fecha ingreso -->
            <div class="mb-3">
                <label class="form-label">Fecha de Ingreso</label>
                <input type="date" name="fecha_ingreso" class="form-control" value="{{ cliente.fecha_ingreso.strftime('%Y-%m-%d') }}" required>
            </div>

            <!-- Vencimiento de membresía -->
            <div class="mb-3">
                <label class="form-label">Fecha de Vencimiento de Membresía</label>
                <input type="date" name="membresia_vencimiento" class="form-control"
                        value="{{ cliente.membresia_vencimiento.strftime('%Y-%m-%d') if cliente.membresia_vencimiento else '' }}">
            </div>

            <!-- Foto de perfil (opcional) -->
            <div class="mb-3">
                <label class="form-label">Actualizar Foto de Perfil (opcional)</label>
                <input type="file" name="foto_perfil" class="form-control" accept="image/*">
            </div>

            <!-- Botones -->
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                <a href="{{ url_for('admin.lista_clientes') }}" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
