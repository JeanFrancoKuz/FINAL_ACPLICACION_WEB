{% extends "base/layout_admin.html" %}

{% block title %}Editar Pago - Admin{% endblock %}

{% block content %}
<h2 class="fw-bold mb-4">Editar Pago</h2>

<div class="card shadow-sm border-0 p-4">
    <div class="card-body">

        <form method="POST" enctype="multipart/form-data">

            <!-- Cliente -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Cliente</label>
                <input type="text" class="form-control" value="{{ pago.cliente.nombre }}" disabled>
            </div>

            <!-- Monto -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Monto</label>
                <input type="number" step="0.01" name="monto" class="form-control" value="{{ pago.monto }}" required>
            </div>

            <!-- Tipo de pago -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Tipo de Pago</label>
                <select name="tipo" class="form-select" required>
                    {% for tipo in ['EFECTIVO','TRANSFERENCIA','TARJETA'] %}
                        <option value="{{ tipo }}" {% if pago.tipo.value == tipo %}selected{% endif %}>
                            {{ tipo }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Subir comprobante -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Añadir nuevo comprobante (opcional)</label>
                <input type="file" name="comprobante" class="form-control">

                {% if pago.fotos %}
                <div class="mt-3">
                    <label class="fw-bold">Comprobantes existentes</label>
                    <table class="table table-sm table-bordered mt-2">
                        <thead class="table-secondary text-center">
                            <tr><th>Archivo</th><th>Ver</th></tr>
                        </thead>
                        <tbody>
                            {% for foto in pago.fotos %}
                            <tr>
                                <td>{{ foto.nombre_archivo }}</td>
                                <td>
                                    <a href="{{ url_for('static', filename=foto.ruta) }}" target="_blank" class="btn btn-outline-dark btn-sm">
                                        Ver
                                    </a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                {% endif %}
            </div>

            <!-- Botones -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success px-4">Guardar Cambios</button>
                <a href="{{ url_for('pago.lista_pagos') }}" class="btn btn-secondary px-4">Cancelar</a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
