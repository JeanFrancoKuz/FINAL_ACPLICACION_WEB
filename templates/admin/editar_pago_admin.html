{% extends "base/layout_admin.html" %}

{% block title %}Editar Pago - Admin{% endblock %}

{% block content %}
<h1 class="mb-4">Editar Pago</h1>

<div class="card">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <!-- Cliente -->
            <div class="mb-3">
                <label class="form-label">Cliente</label>
                <input type="text" class="form-control" value="{{ pago.cliente.nombre }}" disabled>
            </div>

            <!-- Monto -->
            <div class="mb-3">
                <label for="monto" class="form-label">Monto</label>
                <input type="number" step="0.01" name="monto" id="monto" class="form-control" value="{{ pago.monto }}" required>
            </div>

            <!-- Tipo de pago -->
            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo de Pago</label>
                <select name="tipo" id="tipo" class="form-select" required>
                    {% for tipo in ['EFECTIVO', 'TRANSFERENCIA', 'TARJETA', 'OTRO'] %}
                        <option value="{{ tipo }}" {% if pago.tipo.value == tipo %}selected{% endif %}>{{ tipo }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Subir comprobante -->
            <div class="mb-3">
                <label for="comprobante" class="form-label">Comprobante (opcional)</label>
                <input type="file" name="comprobante" id="comprobante" class="form-control">
                {% if pago.fotos %}
                    <p class="mt-2">Comprobantes existentes:</p>
                    <ul>
                        {% for foto in pago.fotos %}
                            <li><a href="{{ url_for('static', filename=foto.ruta) }}" target="_blank">{{ foto.nombre_archivo }}</a></li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>

            <!-- Botones -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Guardar Cambios</button>
                <a href="{{ url_for('pago.lista_pagos') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
