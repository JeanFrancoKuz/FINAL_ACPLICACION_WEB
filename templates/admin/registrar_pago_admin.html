{% extends "base/layout_admin.html" %}

{% block title %}Registrar Pago{% endblock %}

{% block content %}
<h1 class="mb-4">Registrar Pago - {{ cliente.nombre }}</h1>

<form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
        <label for="monto" class="form-label">Monto:</label>
        <input type="number" step="0.01" name="monto" id="monto" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="tipo" class="form-label">Tipo de pago:</label>
        <select name="tipo" id="tipo" class="form-select" required>
            <option value="EFECTIVO">Efectivo</option>
            <option value="TRANSFERENCIA">Transferencia</option>
            <option value="TARJETA">Tarjeta</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="comprobante" class="form-label">Comprobante (opcional):</label>
        <input type="file" name="comprobante" id="comprobante" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Registrar Pago</button>
    <a href="{{ url_for('pago.lista_pagos') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
