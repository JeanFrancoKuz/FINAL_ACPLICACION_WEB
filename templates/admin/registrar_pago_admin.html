{% extends "base/layout_admin.html" %}
{% block title %}Registrar Pago - Admin{% endblock %}

{% block content %}

<h2 class="sect-title">Registrar Pago</h2>
<a href="{{ url_for('pago.lista_pagos') }}" class="btn-back">◀ Volver</a>

<!-- Info del cliente -->
<div class="card-pago-info">
    <h5>{{ cliente.nombre }}</h5>
    <p><b>Cédula:</b> {{ cliente.cedula }}</p>
    <p><b>Correo:</b> {{ cliente.correo }}</p>
</div>

<!-- FORMULARIO -->
<div class="form-pago">
    <form method="POST" enctype="multipart/form-data" class="row g-3">

        <div class="col-md-4">
            <label>Monto</label>
            <input type="number" name="monto" step="0.01" required placeholder="Cantidad">
        </div>

        <div class="col-md-4">
            <label>Tipo de Pago</label>
            <select name="tipo" required>
                <option value="EFECTIVO">Efectivo</option>
                <option value="TRANSFERENCIA">Transferencia / Pago movil</option>
                <option value="TARJETA">Tarjeta</option>
            </select>
        </div>

        <div class="col-md-4">
            <label>Comprobante (opcional)</label>
            <input type="file" name="comprobante" accept="image/*,.pdf">
        </div>

        <!-- BOTONES -->
        <div class="mt-4 d-flex gap-3">
            <button class="btn-save-pago" type="submit">Registrar Pago</button>
            <a href="{{ url_for('pago.lista_pagos') }}" class="btn-cancel-pago">Cancelar</a>
        </div>

    </form>
</div>

{% endblock %}
