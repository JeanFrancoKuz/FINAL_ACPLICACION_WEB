<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel Cliente{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cliente.css') }}">
</head>

    <body class="cliente-body">

        {% include "base/navbar_cliente.html" %}

        <main class="cliente-main">
            {% block content %}{% endblock %}
        </main>

        {% include "base/footer_cliente.html" %}
        <script>
            const toggleC = document.getElementById("nav-toggle-cliente");
            const menuC   = document.getElementById("nav-links-cliente");
            toggleC?.addEventListener("click",()=>menuC.classList.toggle("open"));
            document.querySelectorAll("#nav-links-cliente a")
                .forEach(a=>a.addEventListener("click",()=>menuC.classList.remove("open")));
        </script>
    </body>
</html>
