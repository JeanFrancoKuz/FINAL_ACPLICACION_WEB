<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel Administrativo{% endblock %}</title>

    <!-- IMPORTACIONES -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

    <body class="admin-body">

        {% include "base/navbar_admin.html" %}

        <main class="admin-main">
            {% block content %}{% endblock %}
        </main>

        {% include "base/footer_admin.html" %}
        <script>
            const toggleA = document.getElementById("nav-toggle-admin");
            const menuA   = document.getElementById("nav-links-admin");
            toggleA?.addEventListener("click",()=>menuA.classList.toggle("open"));
            document.querySelectorAll("#nav-links-admin a")
                .forEach(a=>a.addEventListener("click",()=>menuA.classList.remove("open")));
        </script>
    </body>
</html>
