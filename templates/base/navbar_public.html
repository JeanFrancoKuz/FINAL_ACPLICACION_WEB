<!-- Navbar Pública - HITO ALL SPORT -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow-sm fixed-top">
    <div class="container d-flex align-items-center">

        <!-- LOGOTIPO -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="HITO ALL SPORT" height="42">
            <span class="fw-bold fs-5 tracking-wide">HITO ALL SPORT</span>
        </a>

        <!-- Toggle Responsive -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPublico">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menú -->
        <div class="collapse navbar-collapse" id="navbarPublico">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                <li class="nav-item"><a class="nav-link hover-underline" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link hover-underline" href="#servicios">Servicios</a></li>
                <li class="nav-item"><a class="nav-link hover-underline" href="#contacto">Contacto</a></li>

                {% if not current_user.is_authenticated %}
                <!-- Si NO está logueado -->
                <li class="nav-item">
                    <a class="btn btn-danger px-4 fw-semibold shadow-sm" href="{{ url_for('auth.login') }}">
                        Ingresar
                    </a>
                </li>

                {% else %}
                <!-- Si está logueado -->
                <li class="nav-item">
                    <a class="btn btn-warning px-3 fw-semibold shadow-sm"
                       href="{% if current_user.rol.nombre=='CLIENTE' %}
                                {{ url_for('cliente.dashboard_cliente') }}
                             {% else %}
                                {{ url_for('admin.dashboard_admin') }}
                             {% endif %}">
                        Panel
                    </a>
                </li>

                <li class="nav-item">
                    <form action="{{ url_for('auth.logout') }}" method="POST" class="d-inline">
                        <button class="btn btn-outline-light fw-semibold">Salir</button>
                    </form>
                </li>
                {% endif %}

            </ul>
        </div>
    </div>
</nav>

<!-- Estilos personalizados -->
<style>
    nav.navbar { backdrop-filter: blur(6px); }

    .hover-underline {
        position: relative;
        transition: color .2s;
    }
    .hover-underline::after {
        content:"";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: #dc3545;
        transition: .3s;
    }
    .hover-underline:hover::after {
        width: 100%;
    }
</style>
