<!-- Navbar Pública - HITO ALL SPORT -->
<nav class="navbar navbar-expand-lg nav-public fixed-top py-3">
    <div class="container d-flex align-items-center">

        <!-- LOGO / BRAND -->
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="HITO ALL SPORT" height="42">
            <span class="fs-5">HITO ALL SPORT</span>
        </a>

        <!-- TOGGLE -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPublico">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENU -->
        <div class="collapse navbar-collapse" id="navbarPublico">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4">

                <li class="nav-item"><a class="nav-link hover-underline" href="#inicio">Inicio</a></li>
                <li class="nav-item"><a class="nav-link hover-underline" href="#servicios">Servicios</a></li>
                <li class="nav-item"><a class="nav-link hover-underline" href="#contacto">Contacto</a></li>

                {% if not current_user.is_authenticated %}

                <!-- 🔴 BOTÓN INGRESAR CUANDO NO HAY SESIÓN -->
                <li class="nav-item">
                    <a class="btn-red px-4 fw-semibold" href="{{ url_for('auth.login') }}">
                        Ingresar
                    </a>
                </li>

                {% else %}

                <!-- 🟢 BOTÓN PANEL SEGÚN ROL -->
                <li class="nav-item">
                    <a class="btn-blue px-4 fw-semibold"
                        href="{% if current_user.rol.nombre=='CLIENTE' %}
                                {{ url_for('cliente.dashboard_cliente') }}
                            {% else %}
                                {{ url_for('admin.dashboard_admin') }}
                            {% endif %}">
                        Panel
                    </a>
                </li>

                <li class="nav-item">
                    <form action="{{ url_for('auth.logout') }}" method="POST" class="d-inline">
                        <button class="btn-red-soft px-3 fw-bold ms-lg-2">Salir</button>
                    </form>
                </li>

                {% endif %}
            </ul>
        </div>
    </div>
</nav>
