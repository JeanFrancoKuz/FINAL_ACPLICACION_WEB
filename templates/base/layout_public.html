<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO y Accesibilidad -->
    <meta name="theme-color" content="#000000">
    <meta name="author" content="HITO ALL SPORT">
    <meta name="description" content="Sistema de control fitness — Pagos, progreso, asistencias y dashboard para clientes del gimnasio.">
    <title>{% block title %}HITO ALL SPORT{% endblock %}</title>
    <!-- CSS en orden correcto -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> <!-- nuestro theme oscuro -->
</head>
<!--🔥 modo oscuro habilitado + animación -->
<body class="app-dark fadeIn">
    <!-- NAVBAR Público -->
    {% include "base/navbar_public.html" %}
    <!-- Flash mensajes -->
    <div class="container mt-4 flash-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm">
                {{ msg }}
                <button class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
    </div>
    <!-- Contenido principal full-width (hero necesita esto) -->
    <main class="content-wrap">
        {% block content %}{% endblock %}
    </main>
    <!-- FOOTER -->
    {% include "base/footer_public.html" %}
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
