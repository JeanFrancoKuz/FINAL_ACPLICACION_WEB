<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO y Accesibilidad -->
    <meta name="theme-color" content="#000000">
    <meta name="author" content="HITO ALL SPORT">
    <meta name="description" content="Sistema de control fitness — Pagos, progreso, asistencias y dashboard para clientes del gimnasio.">

    <title>{% block title %}HITO ALL SPORT{% endblock %}</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">

    <!-- Animaciones opcionales y estilos globales -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        /* Mejores espacios visuales */
        main {
            min-height: 75vh;
            padding-top: 30px;
        }

        /* Alertas más visibles */
        .flash-container {
            position: sticky;
            top: 10px;
            z-index: 2000;
        }
    </style>
</head>

<body class="bg-light text-dark">

    <!-- NAVBAR Público -->
    {% include "base/navbar_public.html" %}

    <!-- ⚠ Notificaciones Flash globales -->
    <div class="container mt-3 flash-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm">
                        {{ msg }}
                        <button class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Contenido principal -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include "base/footer_public.html" %}

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>

</body>
</html>
