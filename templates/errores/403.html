{% extends "base/layout_public.html" %}
{% block title %}403 | Acceso Denegado{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-2 text-danger fw-bold">403</h1>
    <h3 class="fw-semibold">No tienes permiso para acceder aquí.</h3>
    <p class="text-muted">Si crees que esto es un error, contacta al administrador del sistema.</p>

    <a href="{{ url_for('index') }}" class="btn btn-dark mt-3 px-4">Volver al Inicio</a>
</div>
{% endblock %}
