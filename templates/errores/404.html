{% extends "base/layout_public.html" %}
{% block title %}404 | Página no encontrada{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-2 fw-bold text-warning">404</h1>
    <h3 class="fw-semibold">Página no encontrada</h3>
    <p class="text-muted">
        Lo sentimos, el recurso que buscas no está disponible o fue movido.
    </p>

    <a href="{{ url_for('index') }}" class="btn btn-warning mt-3 px-4 fw-bold">Volver al Inicio</a>
</div>
{% endblock %}
