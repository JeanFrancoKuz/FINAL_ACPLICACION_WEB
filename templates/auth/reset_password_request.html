{% extends 'base/layout_public.html' %}
{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white text-center">
                    <h4 class="m-0 fw-bold">Recuperar Acceso</h4>
                </div>

                <div class="card-body">
                    <p class="text-center">
                        Ingresa tu correo. Si existe en el sistema, podrás cambiar la contraseña.
                    </p>

                    <form method="POST" action="{{ url_for('auth.reset_password_request') }}">
                        <div class="mb-3">
                            <label class="form-label">Correo registrado</label>
                            <input type="email" name="correo" class="form-control" required>
                        </div>

                        <button class="btn btn-dark w-100 fw-bold">Enviar Solicitud</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
