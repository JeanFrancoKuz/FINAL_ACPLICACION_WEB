{% extends "base/layout_public.html" %}
{% block title %}Restablecer contraseña{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width:450px">

    <h3 class="mb-3 fw-bold text-center">Cambiar Contraseña 🔐</h3>

    <form method="POST" class="card p-4 shadow">

        <label class="form-label">Nueva contraseña</label>
        <input type="password" name="password" minlength="6" class="form-control mb-3" required>

        <label class="form-label">Repetir</label>
        <input type="password" name="repetir" minlength="6" class="form-control mb-3" required>

        <button class="btn btn-success w-100 fw-bold">Actualizar contraseña</button>
    </form>
</div>
{% endblock %}
