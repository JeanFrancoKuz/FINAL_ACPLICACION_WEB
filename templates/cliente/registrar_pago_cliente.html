{% extends "base/layout_cliente.html" %}
{% block title %}Registrar Pago{% endblock %}

{% block content %}

<h2 class="fw-bold mb-4 text-center">💳 Registrar Pago</h2>

<div class="card bg-dark text-light shadow-lg p-4 mx-auto" style="max-width: 600px;">

    <form method="POST" enctype="multipart/form-data">

        <!-- MONTO -->
        <div class="mb-3">
            <label class="form-label fw-semibold">Monto a pagar</label>
            <input type="number" step="0.01" min="1" name="monto" class="form-control" required placeholder="Ej: 15.00">
        </div>

        <!-- TIPO -->
        <div class="mb-3">
            <label class="form-label fw-semibold">Método de pago</label>
            <select name="tipo" class="form-select fw-semibold" required>
                <option value="EFECTIVO">💵 Efectivo</option>
                <option value="TRANSFERENCIA">🏦 Transferencia</option>
                <option value="TARJETA">💳 Tarjeta</option>
            </select>
        </div>

        <!-- COMPROBANTE -->
        <div class="mb-3">
            <label class="form-label fw-semibold">Comprobante (Opcional)</label>
            <input type="file" name="comprobante" class="form-control" accept="image/*,.pdf">
            <small class="text-secondary">Aceptado: .jpg / .png / .pdf</small>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success px-4 fw-bold">Enviar Pago</button>

            {#  🔥 Se corrigió esta ruta (antes causaba error) #}
            <a href="{{ url_for('cliente.dashboard_cliente') }}" class="btn btn-secondary px-4">Cancelar</a>
        </div>

    </form>
</div>

{% endblock %}
