{% extends "base/layout_cliente.html" %}
{% block title %}Registrar Pago{% endblock %}

{% block content %}

<h2 class="cliente-title text-center">💸 Registrar Pago</h2>

<div class="page-center">

    <div class="cliente-card max-600">

        <!-- ⚠️ IMPORTANTE: enctype="multipart/form-data" -->
        <form method="POST" enctype="multipart/form-data" class="cliente-form">

            <!-- PLAN -->
            <label class="cliente-label mt-3">Plan</label>
            <select name="plan" class="cliente-input" required>
                <option value="">Seleccionar...</option>
                <option value="PESAS"  {{ 'selected' if plan == 'PESAS' }}>Plan Pesas</option>
                <option value="FULL"   {{ 'selected' if plan == 'FULL' }}>Plan Full</option>
                <option value="PROMO"  {{ 'selected' if plan == 'PROMO' }}>Promoción</option>
            </select>

            <!-- DESCRIPCIÓN -->
            <label class="cliente-label mt-3">Descripción</label>
            <textarea name="descripcion" class="cliente-input" rows="2">{{ descripcion or '' }}</textarea>

            <!-- MONTO -->
            <label class="cliente-label mt-3">Monto (Bs)</label>
            <input type="number" step="0.01" name="monto"
                    class="cliente-input"
                    value="{{ monto_sugerido or '' }}"
                    required>

            <!-- TIPO DE PAGO -->
            <label class="cliente-label mt-3">Tipo de pago</label>
            <select name="tipo" class="cliente-input" required>
                <option value="">Seleccionar...</option>
                <option value="EFECTIVO">Efectivo</option>
                <option value="TRANSFERENCIA">Transferencia / Pago móvil</option>
                <option value="TARJETA">Tarjeta</option>
            </select>

            <!-- 📸 COMPROBANTE -->
            <label class="cliente-label mt-3">Subir comprobante</label>
            <input type="file"
                    name="comprobante"
                    class="cliente-input"
                    accept=".jpg,.jpeg,.png,.webp,.gif,.pdf">

            <!-- BOTÓN -->
            <button class="cliente-btn btn-blue mt-4 w-100">
                ✔ Enviar pago
            </button>

        </form>

    </div>
</div>

{% endblock %}
