{% extends "base/layout_cliente.html" %}
{% block title %}Registrar Pago{% endblock %}

{% block content %}

<h2 class="cliente-title text-center">💸 Registrar Pago</h2>

<div class="page-center">

    <div class="cliente-card max-600">

        <form method="POST" enctype="multipart/form-data" class="cliente-form">

            <label class="cliente-label">Monto (Bolívares - Bs)</label>
            <input type="number" step="0.01" name="monto"
                class="cliente-input"
                value="{{ monto_sugerido or '' }}" required>

            <label class="cliente-label mt-3">Tipo de pago</label>
            <select name="tipo" class="cliente-input" required>
                <option value="">Seleccionar...</option>
                <option value="transferencia">Transferencia</option>
                <option value="zelle">Zelle</option>
                <option value="pago_movil">Pago móvil</option>
                <option value="efectivo">Efectivo</option>
            </select>

            <label class="cliente-label mt-3">Subir comprobante</label>
            <input type="file" name="comprobante" class="cliente-input">

            <button class="cliente-btn btn-blue mt-4 w-100">
                ✔ Enviar pago
            </button>

        </form>

    </div>

</div>

{% endblock %}
