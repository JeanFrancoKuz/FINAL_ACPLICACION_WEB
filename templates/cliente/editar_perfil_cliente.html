{% extends "base/layout_cliente.html" %}
{% block title %}Editar Perfil{% endblock %}

{% block content %}

<h2 class="cliente-title">Editar Perfil</h2>

<form method="POST" enctype="multipart/form-data" class="cliente-profile-edit-form">

    <!-- FOTO + INPUT -->
    <div class="cliente-edit-photo-wrapper">

        {% if cliente.foto_perfil %}
            <img src="{{ url_for('static', filename=cliente.foto_perfil) }}"
                 class="cliente-edit-photo">
        {% else %}
            <img src="{{ url_for('static', filename='img/placeholder_profile.png') }}"
                 class="cliente-edit-photo">
        {% endif %}

        <label class="cliente-file-label">
            📷 Subir nueva foto
            <input type="file" name="foto" accept="image/*" class="cliente-file-input">
        </label>

    </div>


    <!-- CAMPOS DE TEXTO -->
    <div class="cliente-edit-fields">

        <label>Nombre completo</label>
        <input type="text" name="nombre" value="{{ cliente.nombre }}" required>

        <label>Correo electrónico</label>
        <input type="email" name="correo" value="{{ cliente.correo or '' }}">

        <label>Teléfono</label>
        <input type="text" name="telefono" value="{{ cliente.telefono or '' }}">

        <label>Nueva contraseña (opcional)</label>
        <input type="password" name="password" placeholder="••••••••">

    </div>


    <!-- BOTONES -->
    <div class="cliente-edit-actions">
        <button class="cliente-btn btn-green">✔ Guardar cambios</button>
        <a href="{{ url_for('cliente.detalles_cliente', id=cliente.id) }}" 
            class="cliente-btn btn-red">✖ Cancelar</a>
    </div>

</form>

{% endblock %}
