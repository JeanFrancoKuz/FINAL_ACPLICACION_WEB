{% extends "base/layout_cliente.html" %}
{% block title %}Editar Perfil{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Editar Información Personal</h2>
    <a href="{{ url_for('cliente.detalles_cliente', id=cliente.id) }}" class="btn btn-outline-light btn-sm">
        ← Volver al Perfil
    </a>
</div>

<div class="card bg-dark text-light border border-secondary shadow-lg">
    <div class="card-body">

        <form method="POST" class="row g-4">

            <!-- Nombre -->
            <div class="col-md-6">
                <label class="form-label fw-semibold">Nombre completo</label>
                <input type="text" name="nombre" class="form-control bg-secondary text-white border-0"
                        value="{{ cliente.nombre }}" required>
            </div>

            <!-- Correo -->
            <div class="col-md-6">
                <label class="form-label fw-semibold">Correo electrónico</label>
                <input type="email" name="correo" class="form-control bg-secondary text-white border-0"
                        value="{{ cliente.correo or '' }}" placeholder="mail@ejemplo.com">
            </div>

            <!-- Teléfono -->
            <div class="col-md-6">
                <label class="form-label fw-semibold">Teléfono</label>
                <input type="text" name="telefono" class="form-control bg-secondary text-white border-0"
                        value="{{ cliente.telefono or '' }}" placeholder="Ej. 0412-1234567">
            </div>

            <!-- Cambio de contraseña -->
            <div class="col-md-6">
                <label class="form-label fw-semibold">Cambiar contraseña (opcional)</label>
                <input type="password" name="password" class="form-control bg-secondary text-light border-0"
                        placeholder="Nueva contraseña">
                <small class="text-muted fst-italic">Déjalo vacío si no deseas cambiarla.</small>
            </div>

            <div class="col-12"><hr class="border-secondary"></div>

            <div class="col-12 text-end">
                <button class="btn btn-success px-4 fw-semibold">
                    Guardar cambios ✔
                </button>
            </div>
        </form>

    </div>
</div>

<style>
    input::placeholder { color:#cfcfcf!important; opacity: .7; }
    input:focus { box-shadow:0 0 6px #00ff9d!important; }
</style>

{% endblock %}
